# Pin the compose project name. Deriving it from the directory name means it changes the
# moment the install location moves, which mixes up identically named containers from the
# old project.
name: edge

networks:
  # The single shared network on the host. Every application's compose file joins the same
  # one as external. The real name comes from EDGE_NETWORK in .env (default: edge). The
  # alias inside this file stays "edge" and only the real name varies, because compose does
  # not expand variables in network keys; it has to go through name:.
  # scripts/init.sh creates it with the same value.
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}

# Limits for json-file logs. There is no mechanism here to distribute daemon.json, so
# compose carries them. Traefik's access log goes to the bind mount (./logs/traefik), so
# what collects here is startup output and warnings, but without a limit there is no brake
# at all.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy. Routing is declared by the compose labels of the applications
  # (docker provider, exposedByDefault: false); edge holds no application config.
  #
  # The static config (traefik/generated/traefik.yml) is produced by
  # scripts/render-config.sh, which substitutes .env values into traefik/traefik.yml.
  # Traefik accepts its static config from exactly one of file, environment or arguments,
  # and does not expand environment variables inside the file.
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3
    container_name: edge-traefik
    ports:
      - "80:80"
      - "443:443"
      # The dashboard is published over HTTPS with basic auth when DASHBOARD_HOST /
      # DASHBOARD_AUTH are set in .env (see .env.example); no extra port is needed.
    volumes:
      # For routing discovery. Read-only, since Traefik only reads it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/generated/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/generated/lapi-key:/run/secrets/crowdsec-lapi-key:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # ACME certificate store. Traefik creates acme.json with mode 600.
      - ./traefik/acme:/acme
      - ./logs/traefik:/var/log/traefik
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - crowdsec

  # ---------------------------------------------------------------------------
  # Abuse detection. Reads the Traefik JSON access log, creates decisions, and the bouncer
  # plugin inside Traefik queries the LAPI to enforce them.
  # The LAPI publishes no port; it is reachable only from Traefik on the shared network.
  # ---------------------------------------------------------------------------
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: edge-crowdsec
    environment:
      # Collections to enable (bundles of parsers and scenarios)
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      # Registers the bouncer at startup, so cscli bouncers add is never needed by hand
      BOUNCER_KEY_traefik: ${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY is not set (check .env)}
      TZ: Asia/Tokyo
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Override only the differences instead of replacing the image's config.yaml
      # (CrowdSec's .local mechanism)
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      # Allowlisted IPs (generated by scripts/ban.sh allow). Dropped at the parser stage,
      # so no decision is created for them at all.
      - ./crowdsec/generated/whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/edge-allowlist.yaml:ro
      # The decisions themselves (SQLite) and the credentials of registered machines and
      # bouncers. Losing them clears every block and forces bouncer re-registration, so
      # they live on named volumes.
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - ./logs/traefik:/var/log/traefik:ro
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging

volumes:
  crowdsec-data:
  crowdsec-config:
