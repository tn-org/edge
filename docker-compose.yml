# Pin the compose project name. Deriving it from the directory name means it changes the
# moment the install location moves, which mixes up identically named containers from the
# old project.
name: edge

networks:
  # The single shared network on the host. Every application's compose file joins the same
  # one as external. The real name comes from EDGE_NETWORK in .env (default: edge). The
  # alias inside this file stays "edge" and only the real name varies, because compose does
  # not expand variables in network keys; it has to go through name:.
  # scripts/init.sh creates it with the same value.
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}

# Limits for json-file logs. There is no mechanism here to distribute daemon.json, so
# compose carries them. Traefik's access log goes to the bind mount (./logs/traefik), so
# what collects here is startup output and warnings, but without a limit there is no brake
# at all.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy. Routing is declared by the compose labels of the applications
  # (docker provider, exposedByDefault: false); edge holds no application config.
  #
  # The static config (traefik/generated/traefik.yml) is produced by
  # scripts/render-config.sh, which substitutes .env values into traefik/traefik.yml.
  # Traefik accepts its static config from exactly one of file, environment or arguments,
  # and does not expand environment variables inside the file.
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3
    container_name: edge-traefik
    ports:
      - "80:80"
      - "443:443"
      # The dashboard is published over HTTPS with basic auth when DASHBOARD_HOST /
      # DASHBOARD_AUTH are set in .env (see .env.example); no extra port is needed.
    volumes:
      # For routing discovery. Read-only, since Traefik only reads it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/generated/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/generated/lapi-key:/run/secrets/crowdsec-lapi-key:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # Certificates placed by hand, one <name>.pem + <name>.key pair per apex
      # (EDGE_TLS_MODE=origin-ca). scripts/render-config.sh lists the pairs it finds in
      # traefik/dynamic/generated-tls.yml. In letsencrypt mode the directory is empty and
      # nothing refers to /certs, so the mount costs nothing.
      - ./certs:/certs:ro
      # ACME certificate store. Traefik creates acme.json with mode 600. Mounted in both
      # modes: with origin-ca the static config defines no resolver, so nothing opens it,
      # and keeping the file is what makes switching back a one-line change in .env.
      - ./traefik/acme:/acme
      - ./logs/traefik:/var/log/traefik
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      crowdsec:
        condition: service_started
        # On origin-ca hosts (behind Cloudflare) the stack starts with the CrowdSec
        # service scaled to zero, so the dependency has to be optional. The proxy does
        # not need it either way: the bouncer plugin answers from its local copy of the
        # decisions and lets traffic through while CrowdSec is down (see
        # traefik/dynamic/middlewares.yml).
        required: false

  # ---------------------------------------------------------------------------
  # Abuse detection. Reads the Traefik JSON access log, creates decisions, and the bouncer
  # plugin inside Traefik queries the LAPI to enforce them.
  # The LAPI publishes no port; it is reachable only from Traefik on the shared network.
  #
  # EDGE_TLS_MODE=origin-ca (behind Cloudflare) keeps this container out: every start
  # path scales it to zero (scripts/mode-lib.sh) and render-config.sh drops the bouncer
  # from Traefik's default middlewares. Rate limiting, the concurrency limit and the
  # security headers are Traefik's own and stay in place. With letsencrypt (the default)
  # this service runs as it always has.
  # ---------------------------------------------------------------------------
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: edge-crowdsec
    environment:
      # Collections to enable (bundles of parsers and scenarios)
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      # Registers the bouncer at startup, so cscli bouncers add is never needed by hand.
      # Empty is tolerated at interpolation time (compose interpolates every service even
      # when only the db profile starts); the real guard is render-config.sh, which every
      # start path of the proxy stack (make up, make update) runs first and which refuses
      # an unset key.
      BOUNCER_KEY_traefik: ${CROWDSEC_BOUNCER_KEY:-}
      TZ: Asia/Tokyo
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Override only the differences instead of replacing the image's config.yaml
      # (CrowdSec's .local mechanism)
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      # Allowlisted IPs (generated by scripts/ban.sh allow). Dropped at the parser stage,
      # so no decision is created for them at all.
      - ./crowdsec/generated/whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/edge-allowlist.yaml:ro
      # The decisions themselves (SQLite) and the credentials of registered machines and
      # bouncers. Losing them clears every block and forces bouncer re-registration, so
      # they live on named volumes.
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - ./logs/traefik:/var/log/traefik:ro
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Shared PostgreSQL (optional, profile "db"). One instance per host; every application
  # gets its own database and role on it (make db-create). Off by default: a host whose
  # databases live in a managed service (RDS etc.) never starts it. Not routed by
  # Traefik; reachable from application containers on the shared network under the name
  # edge-postgres, and from the host itself on loopback only.
  # On a workstation the same definition provides the one local database instance that
  # all projects share (make db-up), so nothing else on the machine needs its own.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: edge-postgres
    profiles: [db]
    environment:
      # Empty is tolerated at interpolation time for the same reason as the bouncer key
      # above; the guards are make db-up and render-config.sh (when the db profile is on).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host access for psql, dumps and restores. Loopback only; the network port is
      # never public. The host-side port is configurable for machines where 5432 is
      # already taken; containers on the shared network always use 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crowdsec-data:
  crowdsec-config:
  pgdata:
