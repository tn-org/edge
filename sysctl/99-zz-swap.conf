# Kernel swap tuning for the swapfile created by setup-swap.sh
# Installed to: /etc/sysctl.d/99-zz-swap.conf (by setup-swap.sh, together with
# systemd/swapfile.swap; when it is installed and taken out again, and what vm.swappiness
# does after that: "Swap" in the README)
#
# The name sorts after 99-sysctl.conf, the link to /etc/sysctl.conf. systemd-sysctl, which
# applies the settings at boot, reads the files in name order and the last value read
# wins, so at boot a vm.swappiness left in /etc/sysctl.conf cannot take over from this
# one. A plain 99-swap.conf would sort before it ("sw" comes before "sy").
# That holds for systemd-sysctl only. procps's sysctl --system first reads the files from
# all of the sysctl.d directories (the 99-sysctl.conf link among them) and then, once at
# the very end, /etc/sysctl.conf itself, so when someone runs it by hand, a vm.swappiness
# in /etc/sysctl.conf wins until the next boot. setup-swap.sh loads this file alone with
# sysctl -p and never runs sysctl --system.
#
# Swap on these hosts is a safety margin against the OOM killer, not extra memory. A low
# swappiness makes the kernel drop page cache before it moves process memory out to swap,
# so in normal operation everything stays in RAM and the swapfile only fills under real
# memory pressure. The swapfile sits on the root volume, which is far slower than RAM and
# shares its throughput with everything else on that disk.
#
# 10 rather than the kernel default of 60: 60 readily swaps idle process memory out to
# grow the page cache, which on a small host shows up as slow responses after quiet periods.
# 10 rather than 0: 0 holds off swapping until memory is almost gone, which leaves little
# room between swap starting to help and the OOM killer stepping in.
vm.swappiness = 10
