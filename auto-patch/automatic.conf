# OS自動セキュリティパッチ設定 (dnf-automatic)
# 配置先: /etc/dnf/automatic.conf
#
# security のみ自動適用・自動再起動なし。
# kernel 更新は staged されるが再起動は手動窓で行う。
# dnf-automatic.timer (systemd timer) が日次でこの設定に従って動く。
#
# setup-auto-patch.sh が /path/to/edge を実パスに、__HOSTNAME__ を hostname に置換する。

[commands]
# security のみ（バグ修正や機能更新は対象外）
upgrade_type = security
# 適用前にランダム待機（負荷分散）
random_sleep = 3600
# ダウンロード＆適用する
download_updates = yes
apply_updates = yes
# 自動再起動はしない（kernel 更新は手動再起動窓で対応）
reboot = never

[emitters]
# journald(stdio) に残しつつ、command emitter で report.sh に本文を渡す。
# report.sh os が「適用あり」のときだけ通知ハブへ送る（イベント駆動）。
emit_via = stdio,command
# 通知の差出人表示。ホストごとに違うので setup 時に hostname を埋める
system_name = __HOSTNAME__

[command]
command_format = /path/to/edge/scripts/report.sh os
stdin_format = {body}

[base]
debuglevel = 1
