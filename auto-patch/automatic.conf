# OS automatic security patching (dnf-automatic)
# Installed to: /etc/dnf/automatic.conf
#
# Security updates only, applied automatically, never rebooting.
# Kernel updates are staged; the reboot happens in a manual window.
# dnf-automatic.timer runs daily according to this file.
#
# setup-auto-patch.sh replaces /path/to/edge with the real path and __HOSTNAME__ with the
# host name.

[commands]
# Security only (no bug-fix or feature updates)
upgrade_type = security
# Random wait before applying, to spread load
random_sleep = 3600
# Download and apply
download_updates = yes
apply_updates = yes
# Never reboot automatically (kernel updates wait for a manual reboot window)
reboot = never

[emitters]
# Keep it in journald (stdio) and also hand the body to report.sh through the command
# emitter. report.sh os only forwards it when something was actually applied.
emit_via = stdio,command
# Sender shown in the notification. It differs per host, so setup substitutes the host name.
system_name = __HOSTNAME__

[command]
command_format = /path/to/edge/scripts/report.sh os
stdin_format = {body}

[base]
debuglevel = 1
