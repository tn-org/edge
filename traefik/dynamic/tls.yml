# Host-wide default TLS options. Dynamic config, read by the file provider.
#
# Set explicitly rather than relying on the image's compile-time defaults. Even with a
# pinned tag, a changed default silently changes the effective value, and that change
# never shows up in a diff for review.

tls:
  options:
    default:
      minVersion: VersionTLS12
      # HTTPS without SNI, or for a domain that is not registered here, is rejected during
      # the handshake instead of being served a certificate. Without this, hitting the IP
      # directly or sending an unrelated SNI completes the handshake using the first
      # router's certificate.
      sniStrict: true
      curvePreferences:
        - X25519
        - CurveP256
      # TLS 1.3 cipher suites are fixed in Go and cannot be set here (entries would be
      # ignored). The list below is for TLS 1.2: AEAD (GCM, ChaCha20) with forward secrecy
      # only.
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
