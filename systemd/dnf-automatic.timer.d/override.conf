# Schedule override for dnf-automatic.timer (drop-in)
# Installed to: /etc/systemd/system/dnf-automatic.timer.d/override.conf
#
# Moves the package default (06:00 UTC) to a quiet night-time slot in the operating time
# zone. The empty OnCalendar= resets the default first; without it both would fire.
# Starts at :05, not on the hour: a run that updates docker restarts every container, and
# the ops console runs its hourly checks at :00.
# RandomizedDelaySec is the only spread of the start: automatic.conf sets random_sleep = 0
# (the reason is there).

[Timer]
OnCalendar=
OnCalendar=*-*-* 04:05:00 Asia/Tokyo
RandomizedDelaySec=1800
