# Failure notification and release follow for dnf-automatic.service (drop-in)
# Installed to: /etc/systemd/system/dnf-automatic.service.d/override.conf
#
# Records a failed automatic update run in the file channel (sync/), the same way the
# blocking report does. Without it a failure only lands in journald and nobody notices.

[Unit]
OnFailure=notify-failure@%n.service

# Amazon Linux 2023 locks dnf to one release of its repository: the installed
# system-release package sets the releasever dnf reads. Upgrading that package (and
# whatever it requires) with --releasever=latest moves the lock to the newest release and
# leaves every other update to dnf-automatic, which runs next and sees that release.
# Without it the host stays on the release it was installed from. A failure here fails
# the unit and goes through the same failure notification.
[Service]
ExecStartPre=/usr/bin/dnf -y --releasever=latest upgrade system-release
