# Failure notification for dnf-automatic.service (drop-in)
# Installed to: /etc/systemd/system/dnf-automatic.service.d/override.conf
#
# Records a failed automatic security patch run in the file channel (sync/), the same way
# the blocking report does. Without it a failure only lands in journald and nobody notices.

[Unit]
OnFailure=notify-failure@%n.service
