# Failure notification for dnf-automatic.service (drop-in)
# Installed to: /etc/systemd/system/dnf-automatic.service.d/override.conf
#
# Forwards a failed automatic security patch run to the notification hub, the same way the
# blocking report does. Without it a failure only lands in journald and nobody notices.

[Unit]
OnFailure=notify-failure@%n.service
